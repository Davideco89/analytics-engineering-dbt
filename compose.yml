services:
  metabase:
    image: metabase/metabase:v0.63.16.x
    container_name: analytics-engineering-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Rome
    volumes:
      - metabase-data:/metabase-data
    restart: unless-stopped

volumes:
  metabase-data: